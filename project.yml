name: EmGestPro
options:
  minimumXcodeGenVersion: 2.35.0
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    from: 0.9.19

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.2.1"
    CURRENT_PROJECT_VERSION: "4"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    CLANG_ENABLE_MODULES: YES
    CLANG_ENABLE_OBJC_ARC: YES

targets:
  EmGestPro:
    type: application
    platform: iOS
    sources:
      - path: EmGestPro
        excludes:
          - "Exploit/EmGestPro-Bridging-Header.h"
    dependencies:
      - package: ZIPFoundation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uk.nouvborne.ketamine
        PRODUCT_NAME: EmGestPro
        INFOPLIST_FILE: EmGestPro/App/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: EmGestPro/Exploit/EmGestPro-Bridging-Header.h
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        CODE_SIGN_ENTITLEMENTS: ""
    scheme:
      gatherCoverageData: false
      testTargets: []
    preBuildScripts:
      - name: Generate Patreon Secrets
        script: |
          bash "${SRCROOT}/scripts/generate_secrets.sh"
        basedOnDependencyAnalysis: false
